    <script type="text/babel">
        const { useState, useMemo, useEffect } = React;
        const { createRoot } = ReactDOM;

        // --- ICONOS ---
        const Icons = {
            Truck: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect width="16" height="13" x="1" y="5" rx="2" /><polygon points="16 8 20 8 23 11 23 16 16 16 16 8" /><circle cx="5.5" cy="18.5" r="2.5" /><circle cx="18.5" cy="18.5" r="2.5" /></svg>,
            Plus: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M5 12h14"/><path d="M12 5v14"/></svg>,
            Trash2: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/></svg>,
            Edit: () => <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"/></svg>,
            AlertTriangle: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><path d="M12 9v4"/><path d="M12 17h.01"/></svg>,
            MessageSquare: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>,
            X: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>,
            CloudUpload: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M4 14.899A7 7 0 1 1 15.71 8h1.79a4.5 4.5 0 0 1 2.5 8.242"/><path d="M12 12v9"/><path d="m16 16-4-4-4 4"/></svg>,
            BarChart2: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="18" x2="18" y1="20" y2="10"/><line x1="12" x2="12" y1="20" y2="4"/><line x1="6" x2="6" y1="20" y2="14"/></svg>,
            PieChart: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21.21 15.89A10 10 0 1 1 8 2.83"/><path d="M22 12A10 10 0 0 0 12 2v10z"/></svg>,
            Clock: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>,
            AlertOctagon: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polygon points="7.86 2 16.14 2 22 7.86 22 16.14 16.14 22 7.86 22 2 16.14 2 7.86 7.86 2"/><line x1="12" x2="12" y1="8" y2="12"/><line x1="12" x2="12.01" y1="16" y2="16"/></svg>,
            Activity: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>,
            ArrowUp: () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m18 15-6-6-6 6"/></svg>,
            ArrowDown: () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m6 9 6 6 6-6"/></svg>,
            Minus: () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M5 12h14"/></svg>,
            Lock: () => <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>,
            Unlock: () => <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 9.9-1"/></svg>,
            LogOut: () => <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" x2="9" y1="12" y2="12"/></svg>,
            Shield: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>,
            CheckCircle: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
        };

        // --- FIREBASE SETUP ---
        const firebaseConfig = {
            apiKey: "AIzaSyB5OvYG9qGFrwQGCIIk2ps6R7tBDrhHqrY",
            authDomain: "kpis-stellantis.firebaseapp.com",
            projectId: "kpis-stellantis",
            storageBucket: "kpis-stellantis.firebasestorage.app",
            messagingSenderId: "618714680596",
            appId: "1:618714680596:web:8b7d14cb1dd4e6a9dd0601",
            measurementId: "G-WDXSRLJ6VB"
        };

        let db;
        try {
            if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
            db = firebase.firestore();
        } catch (error) { console.error("Error Firebase:", error); }

        // --- DATOS DEMO ---
        const DEMO_INCIDENTS = [
            { date: '18/11/25', plant: 'Camiones', shift: 'T1', imp: 1, noImp: 0, lateStarts: 3, lateStartsNoAff: 1, serviceLevel: 94.0, safetyScore: 92, onTimeStarts: 90, accidents: 1, causeImpSleep: 1, causeImpAccident: 0, causeImpRoute: 0, causeImpMech: 0 }, 
            { date: '25/11/25', plant: 'Camiones', shift: 'T1', imp: 0, noImp: 2, lateStarts: 1, lateStartsNoAff: 0, serviceLevel: 97.5, safetyScore: 98, onTimeStarts: 98, accidents: 0, causeNoImpTraffic: 2 }, 
        ];

        const DEMO_COMPLAINTS = [
            { date: '01/12/25', plant: 'Camiones', route: 'Ruta 1', issue: 'Retraso', detail: 'Llegó 15 mins tarde a la parada', action: 'Acta Admin', source: 'Laborales', type: 'Servicio' },
        ];

        const PLANTS = ['Todas', 'Camiones', 'Extensión', 'Van', 'Norte', 'Sur'];
        const { weeksDef: WEEKS_DEF } = (() => {
            const weeks = {}; let currentDate = new Date(2025, 10, 17); // Lunes 17 Nov 2025
            let weekCounter = 47; let yearForWeek = 2025; let dayCount = 0; let currentWeekKey = '';
            while (currentDate <= new Date(2026, 11, 31)) {
                const dateStr = `${currentDate.getDate().toString().padStart(2,'0')}/${(currentDate.getMonth()+1).toString().padStart(2,'0')}/${currentDate.getFullYear().toString().slice(-2)}`;
                if (dayCount % 7 === 0) {
                    const k = `S${weekCounter}-${yearForWeek.toString().slice(-2)}`;
                    weeks[k] = { id: k, label: `Sem ${weekCounter}`, fullLabel: `Semana ${weekCounter} '${yearForWeek.toString().slice(-2)}`, dates: [] };
                    currentWeekKey = k; weekCounter++; if (weekCounter > 52) { weekCounter = 1; yearForWeek++; }
                }
                weeks[currentWeekKey].dates.push(dateStr); dayCount++; currentDate.setDate(currentDate.getDate() + 1);
            }
            return { weeksDef: weeks };
        })();

        // --- DEFINICIÓN DE MESES ---
        const MONTHS_DEF = (() => {
            const months = {};
            const end = new Date(2026, 11, 31);
            let cur = new Date(2025, 10, 1);
            const monthNames = ['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
            while (cur <= end) {
                const key = `M${(cur.getMonth()+1).toString().padStart(2,'0')}-${cur.getFullYear().toString().slice(-2)}`;
                const label = `${monthNames[cur.getMonth()]} '${cur.getFullYear().toString().slice(-2)}`;
                const dates = [];
                const daysInMonth = new Date(cur.getFullYear(), cur.getMonth()+1, 0).getDate();
                for (let d = 1; d <= daysInMonth; d++) {
                    dates.push(`${d.toString().padStart(2,'0')}/${(cur.getMonth()+1).toString().padStart(2,'0')}/${cur.getFullYear().toString().slice(-2)}`);
                }
                const weekKeys = Object.keys(WEEKS_DEF).filter(wk => {
                    const firstDate = WEEKS_DEF[wk].dates[0];
                    if (!firstDate) return false;
                    const [dd, mm, yy] = firstDate.split('/');
                    return parseInt(mm) === cur.getMonth()+1 && parseInt('20'+yy) === cur.getFullYear();
                });
                months[key] = { id: key, label, dates, weekKeys };
                cur = new Date(cur.getFullYear(), cur.getMonth()+1, 1);
            }
            return months;
        })();

        // --- CHART COMPONENTS ---
        const TrendChart = ({ data, dataKey, color, title, suffix = '' }) => {
            if (!data || data.length === 0) return null;
            const values = data.map(d => d[dataKey]); const min = Math.min(...values); const max = Math.max(...values);
            const paddingY = (max - min) * 0.2 || 1; const domainMin = Math.max(0, min - paddingY); const domainMax = max + paddingY; const range = domainMax - domainMin || 1;
            const width = 250; const height = 100; const margin = 15;
            const points = data.map((d, i) => `${margin + (i / (data.length - 1)) * (width - 2 * margin)},${height - margin - ((d[dataKey] - domainMin) / range) * (height - 2 * margin)}`).join(" ");
            const dots = data.map((d, i) => ({ x: margin + (i / (data.length - 1)) * (width - 2 * margin), y: height - margin - ((d[dataKey] - domainMin) / range) * (height - 2 * margin), val: d[dataKey], label: d.label }));
            return (
                <div className="flex flex-col items-center w-full bg-white p-4 rounded-xl border border-slate-200 shadow-sm">
                    <h5 className="text-sm font-bold text-slate-600 mb-3 uppercase tracking-wider">{title}</h5>
                    <div className="relative w-full flex justify-center">
                        <svg width="100%" height={height} viewBox={`0 0 ${width} ${height}`} className="overflow-visible">
                            <polyline points={points} fill="none" stroke={color} strokeWidth="3" />
                            {dots.map((dot, i) => (<g key={i}><circle cx={dot.x} cy={dot.y} r="4" fill="white" stroke={color} strokeWidth="2" /><text x={dot.x} y={dot.y - 12} textAnchor="middle" fontSize="11" fill="#475569" fontWeight="bold">{dot.val}{suffix}</text><text x={dot.x} y={height + 15} textAnchor="middle" fontSize="10" fill="#94a3b8">{dot.label}</text></g>))}
                        </svg>
                    </div>
                </div>
            );
        };

        const SimpleDonutChart = ({ data, total, title }) => {
            if (total === 0) return <div className="h-40 flex items-center justify-center text-slate-300 text-xs">Sin datos</div>;
            let acc = 0; const r = 40; const c = 50;
            const segs = data.map(d => {
                const p = d.val / total; if(p===0) return null;
                if(p===1) return { d: `M 50 50 m -40, 0 a 40,40 0 1,0 80,0 a 40,40 0 1,0 -80,0`, color: d.color, label: d.label, val: d.val, percent: 100 };
                const a1 = acc * 360; const a2 = (acc + p) * 360; acc += p;
                const x1 = c + r * Math.cos(Math.PI * a1 / 180); const y1 = c + r * Math.sin(Math.PI * a1 / 180);
                const x2 = c + r * Math.cos(Math.PI * a2 / 180); const y2 = c + r * Math.sin(Math.PI * a2 / 180);
                return { d: `M ${c} ${c} L ${x1} ${y1} A ${r} ${r} 0 ${p > 0.5 ? 1 : 0} 1 ${x2} ${y2} Z`, color: d.color, label: d.label, val: d.val, percent: (p*100).toFixed(0) };
            }).filter(Boolean);
            return (
                <div className="flex flex-col items-center">
                    <h4 className="text-xs font-bold text-slate-500 mb-2 uppercase">{title}</h4>
                    <div className="relative w-32 h-32"><svg viewBox="0 0 100 100" className="transform -rotate-90 w-full h-full">{segs.map((s, i) => <path key={i} d={s.d} fill={s.color} stroke="white" strokeWidth="1" />)}<circle cx="50" cy="50" r="25" fill="white" /></svg><div className="absolute inset-0 flex items-center justify-center flex-col"><span className="text-xl font-bold text-slate-700">{total}</span></div></div>
                    <div className="w-full mt-4 space-y-1 max-h-40 overflow-y-auto pr-1">
                        {segs.map((s, i) => s.val > 0 && (<div key={i} className="flex justify-between text-xs items-center"><div className="flex items-center gap-2"><span className="w-2 h-2 rounded-full min-w-[8px]" style={{backgroundColor: s.color}}></span><span className="text-slate-600 truncate">{s.label}</span></div><span className="font-bold text-slate-800 ml-2">{s.val} ({s.percent}%)</span></div>))}
                    </div>
                </div>
            );
        };

        const SimpleBarChart = ({ data, dataKeys, colors, height = 150 }) => {
            const max = Math.max(...data.flatMap(d => dataKeys.map(k => d[k])), 1);
            return (
                <div className="w-full flex items-end justify-between gap-2" style={{ height: `${height}px` }}>
                    {data.map((item, i) => (
                        <div key={i} className="flex-1 flex flex-col items-center h-full justify-end group">
                            <div className="w-full relative flex items-end justify-center gap-1 h-full bg-slate-50 rounded-t-lg pt-6">
                                {dataKeys.map((key, k) => {
                                    const h = (item[key] || 0) / max * 100;
                                    return <div key={key} className={`w-full max-w-[20px] rounded-t ${colors[k]} relative`} style={{ height: `${item[key]>0 && h<5 ? 5 : h}%` }}>{item[key] > 0 && <span className="absolute -top-5 left-1/2 -translate-x-1/2 text-[10px] font-bold text-slate-600 bg-white/80 px-1 rounded shadow-sm z-10">{item[key]}</span>}</div>
                                })}
                            </div>
                            <div className="mt-2 text-center"><span className="text-[10px] font-bold text-slate-600 block">{item.dayName}</span><span className="text-[9px] text-slate-400 block">{item.date.slice(0,5)}</span></div>
                        </div>
                    ))}
                </div>
            );
        };

        const KpiCard = ({ title, value, prevValue, icon: Icon, colorClass, higherIsBetter = false, suffix = '', tooltip = '' }) => {
            const diff = value - prevValue; const isPos = diff > 0; const isGood = higherIsBetter ? isPos : !isPos;
            const [showTip, setShowTip] = React.useState(false);
            return (
                <div className="bg-white p-5 rounded-xl border border-slate-200 shadow-sm flex flex-col justify-between h-full relative"
                    onMouseEnter={() => tooltip && setShowTip(true)}
                    onMouseLeave={() => setShowTip(false)}>
                    {showTip && (
                        <div style={{position:'absolute',bottom:'calc(100% + 8px)',left:'50%',transform:'translateX(-50%)',zIndex:50,width:'220px',background:'#1e293b',color:'#f1f5f9',fontSize:'12px',lineHeight:'1.5',padding:'10px 12px',borderRadius:'8px',boxShadow:'0 4px 16px rgba(0,0,0,0.25)',pointerEvents:'none'}}>
                            {tooltip}
                            <div style={{position:'absolute',top:'100%',left:'50%',transform:'translateX(-50%)',width:0,height:0,borderLeft:'6px solid transparent',borderRight:'6px solid transparent',borderTop:'6px solid #1e293b'}}></div>
                        </div>
                    )}
                    <div><div className="flex justify-between items-start mb-2"><p className="text-slate-500 text-sm font-medium">{title}</p><div className={`p-1.5 rounded-lg ${colorClass} bg-opacity-10 text-opacity-100`}><Icon /></div></div><h3 className="text-2xl font-bold text-slate-800">{value}<span className="text-base text-slate-400 ml-1">{suffix}</span></h3></div>
                    {prevValue !== null ? <div className={`flex items-center gap-1 text-xs font-bold mt-2 ${diff === 0 ? 'text-slate-400' : (isGood ? 'text-emerald-500' : 'text-red-500')}`}>{diff > 0 ? <Icons.ArrowUp /> : diff < 0 ? <Icons.ArrowDown /> : <Icons.Minus />}<span>{Math.abs(diff).toFixed(suffix === '%' ? 1 : 0)}{suffix} vs sem ant</span></div> : <div className="text-xs text-slate-300 mt-2">Sin datos previos</div>}
                </div>
            );
        };

        // --- DASHBOARD PRINCIPAL ---
        const TransportationDashboard = () => {
            const [incidents, setIncidents] = useState([]);
            const [complaints, setComplaints] = useState([]);
            const [isLoading, setIsLoading] = useState(true);
            const [selectedWeek, setSelectedWeek] = useState('S50-25');
            const [selectedPlant, setSelectedPlant] = useState('Todas');
            const [viewMode, setViewMode] = useState('weekly'); // 'weekly' | 'monthly'
            const [selectedMonth, setSelectedMonth] = useState(Object.keys(MONTHS_DEF)[0] || '');
            
            // Estado para MODALES y EDICIÓN
            const [isModalOpen, setIsModalOpen] = useState(false);
            const [editingItem, setEditingItem] = useState(null);
            const [modalTab, setModalTab] = useState('incident');
            
            const [notification, setNotification] = useState(null);
            
            // --- ESTADO DE AUTENTICACIÓN ---
            const [isAdmin, setIsAdmin] = useState(false);
            const [showLogin, setShowLogin] = useState(false);
            const [passwordInput, setPasswordInput] = useState('');
            const [loginError, setLoginError] = useState(false);

            useEffect(() => {
                if (!db) return;
                const u1 = db.collection("incidents").onSnapshot(s => { setIncidents(s.docs.map(d => ({ id: d.id, ...d.data() }))); setIsLoading(false); });
                const u2 = db.collection("complaints").onSnapshot(s => { setComplaints(s.docs.map(d => ({ id: d.id, ...d.data() }))); });
                return () => { u1(); u2(); };
            }, []);

            const showNotification = (type, message) => { setNotification({ type, message }); setTimeout(() => setNotification(null), 3000); };

            const handleLogin = (e) => {
                e.preventDefault();
                if(passwordInput === 'LIPU77'){
                    setIsAdmin(true); setShowLogin(false); setLoginError(false); setPasswordInput(''); showNotification('success', 'Modo Edición Activado');
                } else { setLoginError(true); }
            };

            const calculateWeekStats = (weekKey) => {
                const w = WEEKS_DEF[weekKey]; if (!w) return null;
                const fInc = incidents.filter(i => w.dates.includes(i.date) && (selectedPlant === 'Todas' || i.plant === selectedPlant));
                const fCom = complaints.filter(c => w.dates.includes(c.date) && (selectedPlant === 'Todas' || c.plant === selectedPlant));
                
                const aggs = fInc.reduce((acc, c) => ({
                    imp: acc.imp + (c.imp || 0), noImp: acc.noImp + (c.noImp || 0), lateStarts: acc.lateStarts + (c.lateStarts || 0), lateStartsNoAff: acc.lateStartsNoAff + (c.lateStartsNoAff || 0), accidents: acc.accidents + (c.accidents || 0), slSum: acc.slSum + (c.serviceLevel || 0),

                                    </div>
                                    <div className="grid grid-cols-4 gap-2 bg-slate-50 p-3 rounded border">
                                        <div><label className="text-xs font-bold text-slate-500">Turno</label><select name="shift" value={formData.shift} onChange={handleChange} className="w-full border rounded p-1 text-sm"><option>T1</option><option>T2</option><option>T3</option></select></div>
                                        <div><label className="text-xs font-bold text-amber-600">I. Tarde c/Afect.</label><input type="number" name="lateStarts" value={formData.lateStarts} onChange={handleChange} className="w-full border rounded p-1 text-sm"/></div>
                                        <div><label className="text-xs font-bold text-amber-400">I. Tarde s/Afect.</label><input type="number" name="lateStartsNoAff" value={formData.lateStartsNoAff} onChange={handleChange} className="w-full border rounded p-1 text-sm"/></div>
                                        <div><label className="text-xs font-bold text-slate-500">Percances</label><input type="number" name="accidents" value={formData.accidents} onChange={handleChange} className="w-full border rounded p-1 text-sm"/></div>
                                    </div>
                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4 mt-2">
                                        {/* IMPUTABLES */}
                                        <div className="border-rose-100 border p-3 bg-rose-50/50 rounded"><h4 className="text-sm font-bold text-rose-600 mb-3 border-b border-rose-200 pb-1">Imputables</h4>
                                            <div className="grid grid-cols-2 gap-x-4 gap-y-2">
                                                <div className="flex justify-between items-center"><label className="text-xs">Op. Dormido</label><input type="number" name="causeImpSleep" value={formData.causeImpSleep} onChange={handleChange} className="w-12 border rounded text-center text-sm"/></div>
                                                <div className="flex justify-between items-center"><label className="text-xs">Siniestro</label><input type="number" name="causeImpAccident" value={formData.causeImpAccident} onChange={handleChange} className="w-12 border rounded text-center text-sm"/></div>
                                                <div className="flex justify-between items-center"><label className="text-xs">Desvío Ruta</label><input type="number" name="causeImpRoute" value={formData.causeImpRoute} onChange={handleChange} className="w-12 border rounded text-center text-sm"/></div>
                                                <div className="flex justify-between items-center"><label className="text-xs">Falla Mec.</label><input type="number" name="causeImpMech" value={formData.causeImpMech} onChange={handleChange} className="w-12 border rounded text-center text-sm"/></div>
                                                <div className="flex justify-between items-center"><label className="text-xs">Supervisor</label><input type="number" name="causeImpSupervisor" value={formData.causeImpSupervisor} onChange={handleChange} className="w-12 border rounded text-center text-sm"/></div>
                                                <div className="flex justify-between items-center"><label className="text-xs">Actitud de Op</label><input type="number" name="causeImpAttitude" value={formData.causeImpAttitude} onChange={handleChange} className="w-12 border rounded text-center text-sm"/></div>
                                                <div className="flex justify-between items-center"><label className="text-xs">Mal Manejo</label><input type="number" name="causeImpDriving" value={formData.causeImpDriving} onChange={handleChange} className="w-12 border rounded text-center text-sm"/></div>
                                                <div className="flex justify-between items-center"><label className="text-xs">Ponchadura</label><input type="number" name="causeImpFlatTire" value={formData.causeImpFlatTire} onChange={handleChange} className="w-12 border rounded text-center text-sm"/></div>
                                                <div className="flex justify-between items-center"><label className="text-xs">Alcoholemia</label><input type="number" name="causeImpAlcohol" value={formData.causeImpAlcohol} onChange={handleChange} className="w-12 border rounded text-center text-sm"/></div>
                                                <div className="flex justify-between items-center"><label className="text-xs">Diesel</label><input type="number" name="causeImpDiesel" value={formData.causeImpDiesel} onChange={handleChange} className="w-12 border rounded text-center text-sm"/></div>
                                                <div className="flex justify-between items-center"><label className="text-xs">Tema de Op.</label><input type="number" name="causeImpOpTheme" value={formData.causeImpOpTheme} onChange={handleChange} className="w-12 border rounded text-center text-sm"/></div>
                                            </div>
                                        </div>
                                        {/* NO IMPUTABLES */}
                                        <div className="border-slate-200 border p-3 bg-slate-50 rounded"><h4 className="text-sm font-bold text-slate-500 mb-3 border-b border-slate-200 pb-1">No Imputables</h4>
                                            <div className="grid grid-cols-2 gap-x-4 gap-y-2">
                                                <div className="flex justify-between items-center"><label className="text-xs">Tráfico</label><input type="number" name="causeNoImpTraffic" value={formData.causeNoImpTraffic} onChange={handleChange} className="w-12 border rounded text-center text-sm"/></div>
                                                <div className="flex justify-between items-center"><label className="text-xs">Calle Cerrada</label><input type="number" name="causeNoImpClosed" value={formData.causeNoImpClosed} onChange={handleChange} className="w-12 border rounded text-center text-sm"/></div>
                                                <div className="flex justify-between items-center"><label className="text-xs">Clima</label><input type="number" name="causeNoImpWeather" value={formData.causeNoImpWeather} onChange={handleChange} className="w-12 border rounded text-center text-sm"/></div>
                                                <div className="flex justify-between items-center"><label className="text-xs">Percance S/R</label><input type="number" name="causeNoImpCrashNoResp" value={formData.causeNoImpCrashNoResp} onChange={handleChange} className="w-12 border rounded text-center text-sm"/></div>
                                                <div className="flex justify-between items-center"><label className="text-xs">Tren</label><input type="number" name="causeNoImpTrain" value={formData.causeNoImpTrain} onChange={handleChange} className="w-12 border rounded text-center text-sm"/></div>
                                                <div className="flex justify-between items-center"><label className="text-xs">Vandalismo</label><input type="number" name="causeNoImpVandalism" value={formData.causeNoImpVandalism} onChange={handleChange} className="w-12 border rounded text-center text-sm"/></div>
                                                <div className="flex justify-between items-center"><label className="text-xs">Sobreaforo</label><input type="number" name="causeNoImpOvercapacity" value={formData.causeNoImpOvercapacity} onChange={handleChange} className="w-12 border rounded text-center text-sm"/></div>
                                                <div className="flex justify-between items-center"><label className="text-xs">Evento Publico</label><input type="number" name="causeNoImpPublicEvent" value={formData.causeNoImpPublicEvent} onChange={handleChange} className="w-12 border rounded text-center text-sm"/></div>
                                                <div className="flex justify-between items-center"><label className="text-xs">Manifestación</label><input type="number" name="causeNoImpProtest" value={formData.causeNoImpProtest} onChange={handleChange} className="w-12 border rounded text-center text-sm"/></div>
                                                <div className="flex justify-between items-center"><label className="text-xs">Obra Publica</label><input type="number" name="causeNoImpPublicWork" value={formData.causeNoImpPublicWork} onChange={handleChange} className="w-12 border rounded text-center text-sm"/></div>
                                                <div className="flex justify-between items-center"><label className="text-xs">Acc. Terceros</label><input type="number" name="causeNoImpThirdPartyCrash" value={formData.causeNoImpThirdPartyCrash} onChange={handleChange} className="w-12 border rounded text-center text-sm"/></div>
                                                <div className="flex justify-between items-center"><label className="text-xs">Otros</label><input type="number" name="causeNoImpOther" value={formData.causeNoImpOther} onChange={handleChange} className="w-12 border rounded text-center text-sm"/></div>
                                            </div>
                                        </div>
                                    </div>
                                </>
                            ) : (
                                <>
                                    <input type="text" name="route" placeholder="Ruta" value={formData.route} onChange={handleChange} className="w-full border rounded p-2 text-sm"/>
                                    <div className="grid grid-cols-2 gap-4">
                                        <select name="issue" value={formData.issue} onChange={handleChange} className="w-full border rounded p-2 text-sm">
                                            <option>Actitud</option>
                                            <option>Retraso</option>
                                            <option>Falla de unidad</option>
                                            <option>Manejo</option>
                                            <option>Desvío de ruta</option>
                                        </select>
                                        <select name="source" value={formData.source} onChange={handleChange} className="w-full border rounded p-2 text-sm"><option>Laborales</option><option>Sindicato</option></select>
                                    </div>
                                    <div><label className="text-xs font-bold text-slate-500">Acción Tomada</label><input type="text" name="action" placeholder="Ej. Acta administrativa, Compromiso..." value={formData.action} onChange={handleChange} className="w-full border rounded p-2 text-sm"/></div>
                                    <textarea name="detail" placeholder="Detalle de la queja..." rows="3" value={formData.detail} onChange={handleChange} className="w-full border rounded p-2 text-sm"></textarea>
                                </>
                            )}
                        </form></div>
                        <div className="p-4 border-t bg-slate-50 flex justify-between">
                            {!initialData ? <button type="button" onClick={onSeed} className="text-xs text-slate-400 flex gap-1 items-center"><Icons.CloudUpload/> Demo</button> : <div></div>}
                            <div className="flex gap-2"><button onClick={close} className="px-4 py-2 rounded text-sm hover:bg-slate-200">Cancelar</button><button type="submit" form="f" className="px-4 py-2 rounded text-sm bg-rose-600 text-white hover:bg-rose-700 shadow">{initialData ? 'Actualizar' : 'Guardar'}</button></div>
                        </div>
                    </div>
                </div>
            );
        };

        const root = createRoot(document.getElementById('root'));
        root.render(<TransportationDashboard />);
    </script>
</body>
</html>
